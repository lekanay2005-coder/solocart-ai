<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Vertex3D — Sign in</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090909;color:#f7f4fa;font-family:Inter,Arial,sans-serif}body{min-height:100svh}.screen{min-height:100svh;display:grid;grid-template-columns:minmax(400px,.92fr) minmax(500px,1.08fr);overflow:hidden}.auth{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100svh;padding:34px clamp(28px,6vw,84px);background:#090909}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:11px;color:#f5f1f8;text-decoration:none;font-size:19px;font-weight:400;letter-spacing:-.055em}.brand b{font-weight:300}.flame{width:25px;height:26px;position:relative}.flame:before{content:"";position:absolute;inset:1px 4px 1px 2px;border-radius:80% 15% 60% 15%;transform:rotate(-43deg);background:linear-gradient(140deg,#ffb8ec,#e98ae0 47%,#9f55e9);clip-path:polygon(50% 0,86% 39%,88% 67%,65% 100%,20% 88%,4% 58%,26% 30%)}.lang{border:1px solid #27232a;border-radius:7px;background:#111;color:#ddd6e4;padding:9px 12px;font-size:12px}.form-wrap{width:min(100%,390px);margin:auto}.form-wrap h1{margin:0;font-size:32px;letter-spacing:-.055em;font-weight:500}.sub{margin:10px 0 29px;color:#a6a0aa;font-size:13px;line-height:1.6}.social-login{display:grid;gap:10px}.social-login button{min-height:48px;border:1px solid #343038;border-radius:8px;background:#090909;color:#eee;display:flex;align-items:center;justify-content:center;gap:12px;font-size:13px;transition:border-color .2s,background .2s}.social-login button:hover{border-color:#8c678d;background:#100c12}.gmark{font-size:16px;font-weight:700;color:#f2f2f2}.apple{font-size:18px;line-height:1}.social-login svg{width:19px;height:19px;flex:none}.divider{display:flex;align-items:center;gap:15px;margin:23px 0;color:#a59cae;font-size:11px;letter-spacing:.12em}.divider:before,.divider:after{content:"";height:1px;flex:1;background:#28252b}form{display:grid;gap:18px}.field{display:grid;gap:8px;color:#e7e1ea;font-size:12px}.label in-top:20px;text-decoration:none}.join:before{content:"";width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:7px solid #f49ce8}.join span{border-radius:20px;padding:9px 17px;background:linear-gradient(100deg,#e783dc,#a87cf2);color:#1a1020;font-size:11px;font-weight:600}.scene{position:absolute;inset:auto 0 0;height:63vh;min-height:410px;display:grid;place-items:center}.scene svg{position:absolute;width:min(100%,500px);height:100%;overflow:visible}.ghost{font-weight:600;font-size:240px;fill:none;stroke:#e98ae00d;stroke-width:1}.orbit-back,.orbit-front{fill:none;stroke:#ee8de0;stroke-width:1.1;opacity:.85}.orbit-back{stroke-dasharray:55 30;stroke-opacity:.4}.orbit-glow{fill:#ff9ce8;filter:url(#glow)}.floor{fill:url(#floor)}.robot{position:absolute;width:clamp(190px,25vw,275px);height:auto;left:50%;bottom:9%;transform:translateX(-50%);filter:drop-shadow(0 15px 34px #dd43cf28)}.gallery{position:absolute;top:22px;right:24px;color:#b5aabe;text-decoration:none;font-size:11px;z-index:5}.gallery:hover{color:#f29ad9}.form-enter{animation:rise .65s both}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

</style></head><body><main class="screen"><section class="auth"><a class="gallery" href="/designs.html">← All experiences</a><header class="top form-enter" style="animation-delay:.05s"><a class="brand" href="#" aria-label="Vertex3D"><span class="flame" aria-hidden="true"></span><span>Vertex<b>3D</b></span></a><button class="lang" type="button">English⌄</button></header><div class="form-wrap form-enter" style="animation-delay:.2s"><h1>Welcome!</h1><p class="sub">Log in to Vertex3D to continue to Vertex3D.</p><div class="social-login"><button type="button" data-social="Google"><svg class="gmark" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285f4" d="M21.6 12.23c0-.72-.06-1.42-.18-2.1H12v3.98h5.38a4.6 4.6 0 0 1-2 3.02v2.46h3.24c1.9-1.75 2.98-4.33 2.98-7.36Z"/><path fill="#34a853" d="M12 22c2.7 0 4.96-.9 6.62-2.42l-3.24-2.46c-.9.6-2.04.96-3.38.96-2.6 0-4.8-1.75-5.58-4.1H3.08v2.54A10 10 0 0 0 12 22Z"/><path fill="#fbbc05" d="M6.42 13.98a6 6 0 0 1 0-3.96V7.48H3.08a10 10 0 0 0 0 9.04l3.34-2.54Z"/><path fill="#ea4335" d="M12 5.92c1.47 0 2.78.5 3.82 1.52l2.86-2.86A9.57 9.57 0 0 0 12 2a10 10 0 0 0-8.92 5.48l3.34 2.54C7.2 7.67 9.4 5.92 12 5.92Z"/></svg>Log in with Google</button><button type="button" data-social="Apple"><svg class="apple" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.7 12.7c0-2.3 1.9-3.4 2-3.5a4.4 4.4 0 0 0-3.5-1.9c-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.9a4.8 4.8 0 0 0-4 2.4c-1.7 2.9-.4 7.2 1.2 9.6.8 1.2 1.7 2.5 3 2.5 1.2-.1 1.7-.8 3.2-.8s2 .8 3.3.8 2.1-1.2 2.9-2.4a10 10 0 0 0 1.3-2.7 4.1 4.1 0 0 1-2.5-4Zm-2.4-7a4.2 4.2 0 0 0 1-3.1 4.4 4.4 0 0 0-2.9 1.5 4 4 0 0 0-1 3 3.7 3.7 0 0 0 2.9-1.4Z"/></svg>Log in with Apple</button></div><div class="divider">OR</div><form id="login"><label class="field">Email<input type="email" name="email" autocomplete="email" required></label><label class="field"><span class="label-row"><span>Password</span><a class="forgot" href="#forgot">Forgot password?</a></span><span class="pass-wrap"><input id="password" type="password" name="password" autocomplete="current-password" required><button class="eye" type="button" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label><button class="submit" type="submit" disabled>Log in</button><p class="message" id="message" role="status" aria-live="polite"></p></form><p class="signup">Don't have an account? <a href="#signup">Sign up</a></p></div></section><section class="showcase" aria-label="Vertex3D creative showcase"><div class="copy"><h2>400K+ users. 50M+ AI<br><span>generated graphics.</span></h2><a class="join" href="#signup"><span>Join Now</span></a></div><div class="scene"><svg viewBox="0 0 421 620" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><defs><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><radialGradient id="floor"><stop stop-color="#bd3cb6" stop-opacity=".27"/><stop offset="1" stop-color="#7b31a5" stop-opacity="0"/></radialGradient></defs><text class="ghost" x="210" y="345" text-anchor="middle">3D</text><ellipse class="floor" cx="210" cy="568" rx="180" ry="55"/><ellipse class="orbit-back" cx="216" cy="483" rx="172" ry="48" transform="rotate(-8 216 483)"/><ellipse class="orbit-front" cx="216" cy="483" rx="172" ry="48" transform="rotate(-8 216 483)"/><circle class="orbit-glow" cx="90" cy="508" r="5"/></svg><img class="robot" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3fd6651e-dc6b-4339-a93a-fb627c0109e0.png" alt="Iridescent glass toy robot on a pedestal"></div></section></main><script>
const form=document.querySelector('#login'),email=form.elements.email,password=form.elements.password,submit=form.querySelector('.submit'),message=document.querySelector('#message'),eye=document.querySelector('.eye');const sync=()=>submit.disabled=!(email.value.trim()&&password.value);form.addEventListener('input',sync);eye.addEventListener('click',()=>{const show=password.type==='password';password.type=show?'text':'password';eye.setAttribute('aria-pressed',String(show));eye.setAttribute('aria-label',show?'Hide password':'Show password')});form.addEventListener('submit',event=>{event.preventDefault();message.textContent='This is a visual login prototype. Authentication is not connected.'});document.querySelectorAll('[data-social]').forEach(button=>button.addEventListener('click',()=>message.textContent=`${button.dataset.social} sign-in is not connected in this prototype.`));document.querySelector('.lang').addEventListener('click',()=>message.textContent='English is the only language available in this prototype.');document.querySelector('.forgot').addEventListener('click',event=>{event.preventDefault();message.textContent='Password recovery is not connected in this prototype.'});
</script></body></html>
